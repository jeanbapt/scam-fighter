[project]
name = "scamfighter"
version = "0.1.0"
description = "Open-source governed email abuse response platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ScamFighter contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
# Prefer packages published at least a week ago (supply-chain cooldown).
exclude-newer = "2026-07-18"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["scamfighter_core", "scamfighter_app"]
mypy_path = ["packages/scamfighter_core", "apps/scamfighter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/scamfighter_core", "apps/scamfighter"]
