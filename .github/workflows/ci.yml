name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default; jobs opt into more if they ever need it.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - name: Lint
        run: uv run --with ruff ruff check .
      - name: Format check
        run: uv run --with ruff ruff format --check .
      - name: Typecheck
        run: >-
          uv run --with mypy mypy
          packages/scamfighter_core/scamfighter_core
          apps/scamfighter/scamfighter_app
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: pip-audit
        run: |
          uv export --extra dev --quiet > /tmp/reqs.txt
          uv run --with pip-audit pip-audit -r /tmp/reqs.txt
