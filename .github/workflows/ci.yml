name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
