name: semgrep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        # urllib findings are audited HTTPS-only call sites (see filing/provenance).
        # Dependabot/uv cooldown policies are configured in-repo separately.
        run: >
          semgrep scan --config auto --error --quiet
          --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
          --exclude-rule package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
          --exclude-rule package_managers.dependabot.missing-dependabot-cooldown.missing-dependabot-cooldown
